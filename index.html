<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buket Tasarımcısı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fbf6ef; --paper:#fffdf9; --ink:#3d3435; --muted:#8a7d7e;
    --pink:#e8a0b0; --pink-soft:#f8e3e8; --rose:#c76f86; --sage:#a9bfa3; --sage-soft:#e6eee3;
    --line:#efe4dc; --shadow:0 10px 30px rgba(140,90,100,.10);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.55;
    background-image:radial-gradient(circle at 10% 0%,#fbe7ec 0,transparent 35%),radial-gradient(circle at 100% 30%,#eef3ea 0,transparent 30%);}
  h1,h2,h3{font-family:"Cormorant Garamond",serif;font-weight:600;margin:0}
  .wrap{max-width:1180px;margin:0 auto;padding:0 16px}
  header{padding:40px 0 16px;text-align:center}
  header h1{font-size:clamp(2.2rem,6vw,3.4rem);color:var(--rose)}
  header p{color:var(--muted);margin:.4rem auto 0;max-width:560px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:22px}
  .drop{display:block;width:100%;border:2px dashed var(--pink);border-radius:22px;background:var(--paper);padding:44px 20px;text-align:center;cursor:pointer;transition:.2s;margin:24px auto;max-width:640px}
  .drop:hover,.drop.over{background:var(--pink-soft)}
  .drop .ico{font-size:2.6rem}
  .btn{background:var(--rose);color:#fff;border:0;border-radius:999px;padding:12px 26px;font:600 1rem Inter;cursor:pointer;transition:.2s}
  .btn:hover{filter:brightness(1.07)} .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:transparent;color:var(--rose);border:1.5px solid var(--pink)}
  .layout{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:24px;align-items:start;margin:24px 0 60px}
  @media(max-width:860px){.layout{grid-template-columns:1fr}}
  .sticky{position:sticky;top:16px} @media(max-width:860px){.sticky{position:static}}
  .photo{width:100%;border-radius:16px;display:block;max-height:520px;object-fit:cover}
  .actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .notice{background:#fff6e8;border:1px solid #f3dfbd;color:#7a5b2c;border-radius:14px;padding:10px 14px;font-size:.9rem;margin-bottom:18px}
  .stack>*+*{margin-top:20px}
  .sec-title{display:flex;align-items:center;gap:10px;font-size:1.6rem;margin-bottom:12px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--sage-soft);border-radius:999px;padding:5px 12px;font-size:.88rem}
  .swatches{display:flex;flex-wrap:wrap;gap:12px}
  .sw{text-align:center;font-size:.78rem;color:var(--muted);width:72px}
  .sw i{display:block;width:56px;height:56px;border-radius:50%;margin:0 auto 6px;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.1)}
  table{width:100%;border-collapse:collapse;font-size:.93rem}
  th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)} th{color:var(--muted);font-weight:500;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
  .tag{border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600}
  .tag.ana{background:var(--pink-soft);color:var(--rose)} .tag.dolgu{background:var(--sage-soft);color:#5d7a56}
  .conf{font-size:.78rem;color:var(--muted)}
  .est{font-size:.72rem;background:#fff6e8;color:#9a6b1f;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
  .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
  .meta div{background:var(--cream);border-radius:14px;padding:12px 14px} .meta b{display:block;font-size:.78rem;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
  .steps{counter-reset:s;list-style:none;padding:0;margin:0}
  .steps li{position:relative;padding:4px 0 18px 56px;border-left:2px solid var(--pink-soft);margin-left:18px}
  .steps li:last-child{border-color:transparent}
  .steps li::before{counter-increment:s;content:counter(s);position:absolute;left:-19px;top:0;width:36px;height:36px;border-radius:50%;background:var(--rose);color:#fff;display:grid;place-items:center;font-weight:600}
  .phase{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--rose);font-weight:600}
  .steps h4{margin:.1rem 0 .3rem;font-size:1.05rem}
  .tip{background:var(--sage-soft);border-radius:10px;padding:7px 12px;font-size:.88rem;margin-top:8px}
  .alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
  .alt{background:var(--cream);border-radius:18px;overflow:hidden;border:1px solid var(--line)}
  .alt svg{display:block;width:100%;height:auto;background:linear-gradient(#fff,#fbeff2)}
  .alt .b{padding:14px}
  .alt h3{font-size:1.3rem}
  .alt ul{padding-left:18px;margin:.4rem 0 0;font-size:.88rem;color:var(--muted)}
  .loader{text-align:center;padding:50px 10px;color:var(--muted)}
  .bloom{width:64px;height:64px;margin:0 auto 14px;animation:spin 3s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .err{background:#fdecec;border:1px solid #f4c7c7;color:#8c3030;border-radius:14px;padding:14px}
  .hidden{display:none!important}
  footer{text-align:center;color:var(--muted);font-size:.82rem;padding:0 0 30px}
</style>
</head>
<body>
<header class="wrap">
  <h1>🌸 Buket Tasarımcısı</h1>
  <p>Beğendiğiniz bir buketin fotoğrafını yükleyin; yapay zekâ çiçekleri tanısın ve aynı buketi adım adım nasıl yapacağınızı göstersin.</p>
</header>

<main class="wrap">
  <label id="drop" class="drop">
    <input id="file" type="file" accept="image/jpeg,image/png" hidden>
    <div class="ico">💐</div>
    <h2 style="font-size:1.6rem;margin:.4rem 0">Buket fotoğrafı yükleyin</h2>
    <p style="color:var(--muted);margin:0 0 16px">Sürükleyip bırakın ya da tıklayın · JPG veya PNG</p>
    <span class="btn">Fotoğraf Seç</span>
  </label>

  <div id="layout" class="layout hidden">
    <aside class="sticky">
      <div class="card">
        <img id="photo" class="photo" alt="Yüklenen buket">
        <div class="actions">
          <button id="analyzeBtn" class="btn">✨ Buketi Analiz Et</button>
          <button id="resetBtn" class="btn ghost">Yeni Fotoğraf</button>
        </div>
      </div>
    </aside>
    <section id="result" class="stack"></section>
  </div>
</main>
<footer>Yapay zekâ ile oluşturulan tanımlamalar ve adetler tahminidir; çiçekçinizle teyit etmenizi öneririz.</footer>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hexOk = h => /^#[0-9a-f]{6}$/i.test(h||"") ? h : "#e8a0b0";
let current = null;

const drop = $("#drop"), file = $("#file");
["dragover","dragenter"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(e => drop.addEventListener(e, () => drop.classList.remove("over")));
drop.addEventListener("drop", ev => { ev.preventDefault(); load(ev.dataTransfer.files[0]); });
file.addEventListener("change", () => load(file.files[0]));
$("#resetBtn").onclick = () => { current = null; file.value = ""; $("#layout").classList.add("hidden"); drop.classList.remove("hidden"); $("#result").innerHTML = ""; };
$("#analyzeBtn").onclick = analyze;

function load(f){
  if(!f) return;
  if(!["image/jpeg","image/png"].includes(f.type)) return alert("Lütfen JPG veya PNG formatında bir görsel seçin.");
  const r = new FileReader();
  r.onload = () => {
    current = { dataUrl: r.result, type: f.type };
    $("#photo").src = r.result;
    drop.classList.add("hidden"); $("#layout").classList.remove("hidden");
    $("#result").innerHTML = `<div class="card"><h2 style="font-size:1.6rem">Hazırız!</h2><p style="color:var(--muted)">Fotoğrafınız yüklendi. Analizi başlatmak için <b>Buketi Analiz Et</b> düğmesine dokunun.</p></div>`;
    $("#analyzeBtn").disabled = false;
  };
  r.readAsDataURL(f);
}

async function shrink(dataUrl, type){
  // Büyük görselleri API için 1568px'e küçült
  const img = new Image(); img.src = dataUrl; await img.decode();
  const m = 1568, s = Math.min(1, m / Math.max(img.width, img.height));
  if (s === 1 && dataUrl.length < 5e6) return { data: dataUrl.split(",")[1], type };
  const c = document.createElement("canvas"); c.width = img.width*s; c.height = img.height*s;
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return { data: c.toDataURL("image/jpeg", .9).split(",")[1], type: "image/jpeg" };
}

async function analyze(){
  if(!current) return;
  $("#analyzeBtn").disabled = true;
  $("#result").innerHTML = `<div class="card loader">${flowerSvg("bloom")}<p>Çiçekler inceleniyor, renkler okunuyor…</p></div>`;
  try{
    const img = await shrink(current.dataUrl, current.type);
    const r = await fetch("/api/analyze", { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({ image: img.data, mediaType: img.type }) });
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || "Analiz başarısız oldu.");
    render(d);
  }catch(e){
    $("#result").innerHTML = `<div class="err"><b>Bir sorun oluştu:</b> ${esc(e.message)}</div>`;
  }finally{ $("#analyzeBtn").disabled = false; }
}

function render(d){
  if(d.is_bouquet === false){
    $("#result").innerHTML = `<div class="card"><h2 style="font-size:1.6rem">Bu bir buket gibi görünmüyor 🌿</h2><p>${esc(d.summary)}</p></div>`; return;
  }
  const flowers = d.flowers||[], main = flowers.filter(f=>f.role==="ana"), fill = flowers.filter(f=>f.role!=="ana");
  const row = f => `<tr><td><b>${esc(f.name)}</b><div class="conf">Güven: ${esc(f.confidence||"—")}</div></td><td><span class="tag ${f.role==="ana"?"ana":"dolgu"}">${f.role==="ana"?"Ana":"Dolgu"}</span></td><td>${esc(f.color)}</td><td>~${esc(f.quantity)}</td></tr>`;
  $("#result").innerHTML = `
  <div class="notice">⚠️ Çiçek türleri ve adetler fotoğraftan yapılan <b>tahminlerdir</b>. Kesin sonuç için çiçekçinize danışın.</div>
  <div class="card">
    <h2 style="font-size:2rem;color:var(--rose)">${esc(d.title)}</h2>
    <p>${esc(d.summary)}</p>
    <div class="meta"><div><b>Stil</b>${esc(d.style)}</div><div><b>Dizilim</b>${esc(d.arrangement)}</div></div>
  </div>
  <div class="card"><div class="sec-title">🎨 Renk Paleti</div>
    <div class="swatches">${(d.palette||[]).map(p=>`<div class="sw"><i style="background:${hexOk(p.hex)}"></i>${esc(p.name)}</div>`).join("")}</div></div>
  <div class="card"><div class="sec-title">🌷 Çiçekler <span class="est">TAHMİNİ</span></div>
    <div style="overflow-x:auto"><table><thead><tr><th>Çiçek</th><th>Rol</th><th>Renk</th><th>Adet (tahmini)</th></tr></thead>
    <tbody>${[...main,...fill].map(row).join("")}</tbody></table></div></div>
  <div class="card"><div class="sec-title">🌿 Yeşillik ve Dekor <span class="est">TAHMİNİ</span></div>
    ${(d.greenery||[]).map(g=>`<p style="margin:.3rem 0"><b>${esc(g.name)}</b> · ~${esc(g.quantity)} <span class="conf">${esc(g.note)}</span></p>`).join("")}
    <div class="chips" style="margin-top:10px">${(d.decor||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div></div>
  <div class="card"><div class="sec-title">✂️ Adım Adım Yapılışı</div>
    <ol class="steps">${(d.steps||[]).map(s=>`<li><div class="phase">${esc(s.phase)}</div><h4>${esc(s.title)}</h4><div>${esc(s.detail)}</div>${s.tip?`<div class="tip">💡 ${esc(s.tip)}</div>`:""}</li>`).join("")}</ol></div>
  <div class="card"><div class="sec-title">✨ Alternatif Tasarımlar</div>
    <p class="conf" style="margin-top:-6px">Önizlemeler, yapay zekânın önerdiği renk ve forma göre oluşturulan temsili çizimlerdir.</p>
    <div class="alts">${(d.alternatives||[]).map((a,i)=>`<div class="alt">${bouquetSvg(a,i)}<div class="b"><h3>${esc(a.name)}</h3><p style="margin:.3rem 0;font-size:.92rem">${esc(a.description)}</p><ul>${(a.swaps||[]).map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div></div>`).join("")}</div></div>`;
}

function flowerSvg(cls){
  const petals = Array.from({length:8},(_,i)=>`<ellipse cx="32" cy="14" rx="7" ry="13" fill="#e8a0b0" opacity=".85" transform="rotate(${i*45} 32 32)"/>`).join("");
  return `<svg class="${cls}" viewBox="0 0 64 64">${petals}<circle cx="32" cy="32" r="7" fill="#c76f86"/></svg>`;
}

// Alternatif için palete ve forma göre prosedürel buket önizlemesi
function bouquetSvg(a, seed){
  const pal = (a.palette||[]).map(hexOk); if(!pal.length) pal.push("#e8a0b0","#f6d6c8","#fff");
  let s = seed*97+13; const rnd = () => (s = (s*9301+49297)%233280)/233280;
  const shape = a.shape||"yuvarlak", cx=150, cy=110;
  let out = `<svg viewBox="0 0 300 260" role="img" aria-label="${esc(a.name)} önizleme">`;
  // saplar ve kâğıt
  out += `<path d="M110 150 L150 250 L190 150 Z" fill="#f3e6d8"/><path d="M95 140 L150 250 L130 140 Z" fill="#ead6c3"/>`;
  for(let i=0;i<7;i++) out += `<line x1="${150+(rnd()-.5)*30}" y1="150" x2="${148+(rnd()-.5)*8}" y2="235" stroke="#7d9a72" stroke-width="2"/>`;
  out += `<path d="M135 205 q15 8 30 0" stroke="${pal[0]}" stroke-width="5" fill="none"/>`;
  // yapraklar
  for(let i=0;i<14;i++){ const ang=rnd()*Math.PI*2, r=55+rnd()*25, x=cx+Math.cos(ang)*r, y=cy+Math.sin(ang)*r*(shape==="kaskad"?1.3:.8);
    out += `<ellipse cx="${x}" cy="${y}" rx="7" ry="18" fill="${rnd()>.5?"#a9bfa3":"#8fab88"}" transform="rotate(${ang*57.3+90} ${x} ${y})"/>`; }
  if(shape==="kaskad") for(let i=0;i<6;i++){ const x=125+rnd()*50, y=150+i*14; out+=`<circle cx="${x}" cy="${y}" r="${7-i*.7}" fill="${pal[i%pal.length]}"/>`; }
  // çiçekler
  const n = shape==="doğal"?11:15;
  for(let i=0;i<n;i++){
    const ang=rnd()*Math.PI*2, r=Math.sqrt(rnd())*(shape==="doğal"?62:52);
    const x=cx+Math.cos(ang)*r, y=cy+Math.sin(ang)*r*.75 - (shape==="doğal"?rnd()*20:0), sz=12+rnd()*12, c=pal[i%pal.length];
    if(i%3===0){ out+=`<g>`; for(let p=0;p<6;p++) out+=`<ellipse cx="${x}" cy="${y-sz*.5}" rx="${sz*.32}" ry="${sz*.55}" fill="${c}" transform="rotate(${p*60} ${x} ${y})"/>`; out+=`<circle cx="${x}" cy="${y}" r="${sz*.22}" fill="#f2d27a"/></g>`; }
    else { out+=`<circle cx="${x}" cy="${y}" r="${sz}" fill="${c}"/><circle cx="${x}" cy="${y}" r="${sz*.62}" fill="#000" opacity=".07"/><circle cx="${x}" cy="${y}" r="${sz*.3}" fill="#000" opacity=".07"/>`; }
  }
  for(let i=0;i<12;i++) out+=`<circle cx="${cx+(rnd()-.5)*140}" cy="${cy+(rnd()-.5)*100}" r="2.5" fill="#fff" opacity=".9"/>`;
  return out + `</svg>`;
}
</script>
</body>
</html>
